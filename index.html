<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LMS Server</title>
<style>
:root{
--black:#111318;--black2:#181b21;--text:#181a1f;--muted:#747982;--light:#f4f5f7;--border:#e2e4e8;--white:#fff;
--owner:#8f1515;--supporter:#e75a9d;--admin:#2777d5;--builder:#32a852;--premium:#e88b20;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--text);overflow-x:hidden}
button,a{font-family:inherit}
button{border:0}
a{text-decoration:none;color:inherit}
img{max-width:100%}
.top-notice{width:100%;background:#15171c;color:#fff;padding:10px 20px;text-align:center;font-size:12px;font-weight:900;letter-spacing:.7px}
.navbar{height:82px;background:rgba(255,255,255,.98);border-bottom:1px solid #e8e9ec;display:flex;align-items:center;padding:0 5%;gap:38px;position:sticky;top:0;z-index:1000}
.logo-area{display:flex;align-items:center;flex-shrink:0}
.logo-area img{width:68px;height:68px;object-fit:contain}
.nav-links{display:flex;align-items:center;gap:28px;flex:1}
.nav-links a{color:#44474e;font-size:13px;font-weight:900;transition:.2s}
.nav-links a:hover{color:#111318}
.server-nav-button{background:var(--black);color:#fff;border-radius:7px;padding:13px 19px;font-size:12px;font-weight:950;letter-spacing:.7px;cursor:pointer;box-shadow:0 4px 0 #050609;transition:.2s}
.server-nav-button:hover{transform:translateY(-2px)}
.rank-button{display:inline-flex;align-items:center;justify-content:center;border:2px solid transparent;border-radius:7px;padding:12px 18px;font-size:11px;font-weight:950;letter-spacing:.8px;cursor:pointer;transition:transform .18s,box-shadow .18s,filter .18s}
.rank-button:hover{transform:translateY(-2px);filter:brightness(1.05)}
.rank-button:active{transform:translateY(2px)}
.rank-button.owner{background:var(--owner);color:#fff;border-color:#b92c2c;box-shadow:0 4px 0 #5d0b0b}
.rank-button.supporter{background:var(--supporter);color:#fff;border-color:#f488ba;box-shadow:0 4px 0 #a9376e}
.rank-button.admin{background:var(--admin);color:#fff;border-color:#5d9ce7;box-shadow:0 4px 0 #174b89}
.rank-button.builder{background:var(--builder);color:#fff;border-color:#64ca7d;box-shadow:0 4px 0 #216f37}
.rank-button.premium{background:var(--premium);color:#fff;border-color:#f4ad50;box-shadow:0 4px 0 #99590e}
.rank-button.dark{background:#181b21;color:#fff;border-color:#373b44;box-shadow:0 4px 0 #07080a}
.rank-button.light{background:#fff;color:#181a1f;border-color:#d9dce1;box-shadow:0 4px 0 #c2c5ca}
.hero{min-height:590px;background:linear-gradient(115deg,#101217 0%,#1b2028 48%,#303741 100%);display:flex;align-items:center;padding:90px 7%;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-100px;bottom:-180px;width:600px;height:600px;border-radius:50%;background:rgba(255,255,255,.035)}
.hero-content{max-width:680px;color:#fff;position:relative;z-index:2}
.hero-label{font-size:12px;font-weight:950;letter-spacing:2.5px;margin-bottom:18px;color:#b8bdc5}
.hero h1{font-size:72px;line-height:.98;letter-spacing:-2px;margin-bottom:25px}
.hero p{font-size:17px;line-height:1.7;color:#c7cbd2;max-width:610px;margin-bottom:30px}
.hero-buttons{display:flex;gap:14px;flex-wrap:wrap}
.section{padding:105px 6%}
.section-header{max-width:720px;margin-bottom:45px}
.section-label{font-size:10px;font-weight:950;letter-spacing:2px;color:#8b8f97;margin-bottom:12px}
.section-header h2{font-size:42px;line-height:1.05;margin-bottom:15px}
.section-description{color:var(--muted);font-size:15px;line-height:1.7}
.discord-section{background:#15171c;color:#fff;overflow:hidden}
.discord-grid{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:60px}
.discord-content{max-width:560px}
.discord-content .section-label{color:#9297a0}
.discord-content p{color:#aeb2ba;line-height:1.7;margin-bottom:25px}
.discord-visual{position:relative;min-height:420px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;background:#101217;border:1px solid #2c3037}
.discord-visual:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,17,21,.15),rgba(15,17,21,.02));pointer-events:none}
.discord-visual img{width:100%;height:100%;object-fit:contain;display:block;opacity:.82}
.minecraft-decoration{min-height:300px;height:300px;position:relative;background:#fff;border-top:1px solid #eef0f2;border-bottom:1px solid #eef0f2;overflow:visible}
.minecraft-decoration-content{width:88%;margin:0 auto;height:100%;display:flex;align-items:center}
.minecraft-decoration-text{max-width:420px;position:relative;z-index:2}
.minecraft-decoration-text span{display:block;color:#8b8f97;font-size:10px;font-weight:950;letter-spacing:2px;margin-bottom:8px}
.minecraft-decoration-text strong{font-size:25px;line-height:1.15}
.minecraft-decoration img{position:absolute;right:-35px;bottom:-5px;width:min(610px,50vw);max-width:none;height:auto;max-height:330px;object-fit:contain;object-position:center bottom;pointer-events:none;user-select:none;z-index:1;filter:drop-shadow(0 20px 25px rgba(0,0,0,.10))}
.team-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.team-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:30px;text-align:center;transition:.2s}
.team-card:hover{transform:translateY(-4px);box-shadow:0 15px 35px rgba(0,0,0,.07)}
.team-card img{width:92px;height:92px;image-rendering:pixelated;margin-bottom:17px}
.team-name{font-size:18px;font-weight:950;margin-bottom:10px}
.rank{display:inline-block;padding:6px 10px;border-radius:5px;color:#fff;font-size:9px;font-weight:950;letter-spacing:1px}
.rank.owner{background:var(--owner)}
.rank.supporter{background:var(--supporter)}
.rank.admin{background:var(--admin)}
.rank.builder{background:var(--builder)}
.rank.premium{background:var(--premium)}
.status-section{background:#f5f6f8}
.status-box{background:#fff;border:1px solid #e2e4e8;border-radius:12px;padding:34px;display:flex;align-items:center;justify-content:space-between;gap:30px;transition:.2s}
.status-box:hover{box-shadow:0 15px 35px rgba(0,0,0,.06)}
.status-left{display:flex;align-items:center;gap:18px}
.status-dot{width:14px;height:14px;border-radius:50%;background:#36b85a;box-shadow:0 0 0 6px rgba(54,184,90,.12)}
.status-title{font-size:19px;font-weight:950}
.status-subtitle{color:#858990;font-size:13px;margin-top:4px}
.player-count{font-size:29px;font-weight:950}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px}
.contact-text p{color:var(--muted);line-height:1.7;margin-bottom:25px}
.contact-box{background:#f5f6f8;border-radius:10px;padding:30px}
.contact-item{padding:17px 0;border-bottom:1px solid #dddfe3}
.contact-item:last-child{border-bottom:none}
.contact-item strong{display:block;margin-bottom:5px}
.contact-item span{color:#777b82;font-size:14px}
footer{background:#0f1115;color:#fff;padding:55px 6% 30px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:50px;padding-bottom:45px}
.footer-brand{max-width:400px}
.footer-brand img{width:65px;margin-bottom:15px}
.footer-brand p{color:#8d929b;line-height:1.6;font-size:14px}
.footer-column h4{font-size:12px;letter-spacing:1px;margin-bottom:17px}
.footer-column a{display:block;color:#8d929b;font-size:14px;margin-bottom:11px;transition:.2s}
.footer-column a:hover{color:#fff}
.footer-bottom{border-top:1px solid #24272e;padding-top:25px;display:flex;justify-content:space-between;color:#666b74;font-size:12px}
.connection-modal{position:fixed;inset:0;background:rgba(8,9,12,.8);display:none;align-items:center;justify-content:center;padding:30px;z-index:3000}
.connection-modal.active{display:flex}
.connection-window{width:min(1180px,100%);max-height:90vh;background:#fff;border-radius:13px;overflow:hidden;position:relative;display:grid;grid-template-columns:1.12fr 1fr;box-shadow:0 40px 100px rgba(0,0,0,.45)}
.close-connection{position:absolute;right:16px;top:13px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.06);
