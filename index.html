<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🦆 LMS SERVER</title>


<style>

body{

margin:0;
font-family:Arial,sans-serif;
text-align:center;
color:white;

background:#071a33;

background-image:
linear-gradient(#16365c 1px,transparent 1px),
linear-gradient(90deg,#16365c 1px,transparent 1px);

background-size:35px 35px;

}



header{

padding:60px 20px;

background:#ffd633;

color:#071a33;

border-bottom:5px solid #c99d00;

}



h1{

font-size:55px;
cursor:pointer;

}





nav{

position:sticky;
top:0;

background:#061329ee;

padding:18px;

z-index:20;

}



nav a{

color:white;

text-decoration:none;

margin:12px;

font-weight:bold;

}



nav a:hover{

color:#ffd633;

}





section{

padding:40px 20px;

}




.card{

background:white;

color:#071a33;

max-width:850px;

margin:25px auto;

padding:35px;

border-radius:25px;

box-shadow:0 10px 25px #0008;

}





.button{

background:#ffd633;

color:#071a33;

padding:15px 30px;

border-radius:15px;

font-weight:bold;

cursor:pointer;

border:none;

text-decoration:none;

display:inline-block;

}





/* Cookie Spiel */


.cookie-box{

background:#eef5ff;

padding:25px;

border-radius:20px;

border:3px solid #16365c;

}



.cookie{

width:170px;

height:170px;

margin:25px auto;

background:#c98232;

border-radius:50%;

cursor:pointer;

position:relative;

box-shadow:

inset -15px -15px 20px #7d4218,

0 10px 20px #0005;

transition:.15s;

}



.cookie:hover{

transform:scale(1.08);

}



.cookie:before{

content:"";

position:absolute;

width:18px;

height:18px;

background:#3b2414;

border-radius:50%;

top:35px;

left:45px;

box-shadow:

50px 10px #3b2414,

90px 60px #3b2414,

30px 90px #3b2414,

100px 100px #3b2414;

}



.cookie:active{

transform:scale(.85);

}



.stats{

font-size:22px;

margin:10px;

}



.upgrade{

background:#071a33;

color:white;

padding:15px;

border-radius:12px;

cursor:pointer;

display:inline-block;

}
