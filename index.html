<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LMS Server</title>

<style>
:root{
    --black:#111318;
    --black2:#181b21;
    --text:#181a1f;
    --muted:#747982;
    --light:#f4f5f7;
    --border:#e2e4e8;
    --white:#fff;
    --owner:#8f1515;
    --supporter:#e75a9d;
    --admin:#2777d5;
    --builder:#32a852;
    --premium:#e88b20;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--text);overflow-x:hidden}
button,a{font-family:inherit}
button{border:0}
a{text-decoration:none;color:inherit}
img{max-width:100%}

/* TOP BAR */
.top-notice{width:100%;background:#15171c;color:#fff;padding:7px 16px;text-align:center;font-size:10px;font-weight:900;letter-spacing:1px}

/* NAVIGATION */
.navbar{
    height:66px;background:rgba(255,255,255,.98);border-bottom:1px solid #e8e9ec;
    display:flex;align-items:center;padding:0 4%;gap:22px;position:sticky;top:0;z-index:1000
}
.logo-area{display:flex;align-items:center;flex-shrink:0}
.logo-area img{width:52px;height:52px;object-fit:contain}
.nav-links{display:flex;align-items:center;gap:19px;flex:1}
.nav-links a{color:#44474e;font-size:12px;font-weight:900;white-space:nowrap;transition:.2s}
.nav-links a:hover{color:#111318}

/* MINECRAFT-/CYTOOXIEN-STIL: BLOCKIGE BUTTONS MIT 3D-KANTE */
.server-nav-button,.rank-button,.copy-button,.cookie-button{
    position:relative;
    border:2px solid #686d76;
    border-radius:2px;
    font-weight:950;
    text-transform:uppercase;
    cursor:pointer;
    user-select:none;
    box-shadow:inset 0 2px 0 #ffffff30,inset 0 -3px 0 #00000040,0 4px 0 #111318;
    transition:transform .12s ease,filter .12s ease,box-shadow .12s ease;
}
.server-nav-button{
    background:#30343b;color:#fff;padding:10px 15px;font-size:11px;
    letter-spacing:.7px;white-space:nowrap
}
.server-nav-button:hover,.rank-button:hover,.copy-button:hover,.cookie-button:hover{
    transform:translateY(-2px);filter:brightness(1.13)
}
.server-nav-button:active,.rank-button:active,.copy-button:active,.cookie-button:active{
    transform:translateY(3px);box-shadow:inset 0 2px 0 #00000020,0 1px 0 #171717
}
.rank-button{
    display:inline-flex;align-items:center;justify-content:center;
    border-color:#ffffff40;padding:12px 18px;font-size:11px;letter-spacing:.8px;
    box-shadow:inset 0 2px 0 #ffffff35,inset 0 -3px 0 #00000030,0 4px 0 #171717
}
.rank-button.owner{background:var(--owner);color:#fff;border-color:#e45b60;box-shadow:inset 0 2px 0 #ffffff35,inset 0 -3px 0 #00000030,0 4px 0 #591014}
.rank-button.supporter{background:var(--supporter);color:#fff;border-color:#ff9dce;box-shadow:inset 0 2px 0 #ffffff40,inset 0 -3px 0 #00000030,0 4px 0 #8c285c}
.rank-button.admin{background:var(--admin);color:#fff;border-color:#78b8ff;box-shadow:inset 0 2px 0 #ffffff40,inset 0 -3px 0 #00000030,0 4px 0 #174579}
.rank-button.builder{background:var(--builder);color:#fff;border-color:#75e390;box-shadow:inset 0 2px 0 #ffffff40,inset 0 -3px 0 #00000030,0 4px 0 #15582a}
.rank-button.premium{background:var(--premium);color:#fff;border-color:#ffd477;box-shadow:inset 0 2px 0 #ffffff40,inset 0 -3px 0 #00000030,0 4px 0 #88500c}
.rank-button.dark{background:#181b21;color:#fff;border-color:#686d76;box-shadow:inset 0 2px 0 #ffffff30,inset 0 -3px 0 #00000040,0 4px 0 #111318}
.rank-button.light{background:#fff;color:#181a1f;border-color:#fff;box-shadow:inset 0 2px 0 #fff,inset 0 -3px 0 #b7bdc5,0 4px 0 #858b94}

/* COPY-BUTTON */
.copy-button{
    background:#299b48;color:#fff;border-color:#75e390;padding:11px 16px;
    font-size:11px;letter-spacing:.8px;
    box-shadow:inset 0 2px 0 #ffffff40,inset 0 -3px 0 #00000030,0 4px 0 #15582a;
    margin-bottom:28px
}
.copy-button.copied{background:#299b48;color:#fff;border-color:#75e390}

/* HERO */
.hero{
    min-height:440px;
    background:linear-gradient(115deg,#101217 0%,#1b2028 48%,#303741 100%);
    display:flex;align-items:center;padding:58px 7%;position:relative;overflow:hidden
}
.hero:after{
    content:"";position:absolute;right:-100px;bottom:-180px;width:600px;height:600px;
    border-radius:50%;background:rgba(255,255,255,.035)
}
.hero-content{max-width:680px;color:#fff;position:relative;z-index:2}
.hero-label{font-size:12px;font-weight:950;letter-spacing:2.5px;margin-bottom:12px;color:#b8bdc5}
.hero h1{font-size:58px;line-height:.98;letter-spacing:-2px;margin-bottom:18px}
.hero p{font-size:15px;line-height:1.6;color:#c7cbd2;max-width:610px;margin-bottom:22px}
.hero-buttons{display:flex;gap:14px;flex-wrap:wrap}

/* SECTIONS */
.section{padding:105px 6%}
.section-header{max-width:720px;margin-bottom:45px}
.section-label{font-size:10px;font-weight:950;letter-spacing:2px;color:#8b8f97;margin-bottom:12px}
.section-header h2{font-size:42px;line-height:1.05;margin-bottom:15px}
.section-description{color:var(--muted);font-size:15px;line-height:1.7}

.discord-section{background:#
