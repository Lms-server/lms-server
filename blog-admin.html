
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Admin | LMS NETWORK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #102b50;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 7%;
    border-bottom: 1px solid #e5eaf0;
}

.logo {
    width: 65px;
    cursor: pointer;
}

.home {
    text-decoration: none;
    color: #102b50;
    border: 1px solid #102b50;
    padding: 10px 18px;
    border-radius: 7px;
    font-weight: bold;
}

main {
    max-width: 850px;
    margin: 55px auto;
    padding: 0 20px;
}

h1 {
    font-size: 42px;
    margin-bottom: 8px;
}

.subtitle {
    color: #718096;
    margin-bottom: 35px;
}

.panel {
    background: #f5f8fc;
    border: 1px solid #e1e8f0;
    border-radius: 14px;
    padding: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin: 18px 0 8px;
}

input, textarea, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccd6e2;
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
    background: white;
    color: #102b50;
}

textarea {
    min-height: 220px;
    resize: vertical;
    line-height: 1.6;
}

button {
    border: none;
    border-radius: 7px;
    padding: 12px 18px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

.primary {
    background: #102b50;
    color: white;
}

.secondary {
    background: #e1eaf5;
    color: #102b50;
}

.danger {
    background: #ffe8e8;
    color: #a32323;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
}

#editor, #dashboard {
    display: none;
}

#status {
    margin-top: 15px;
    color: #315d91;
    font-size: 14px;
}

.post {
    background: white;
    border: 1px solid #e1e8f0;
    border-radius: 10px;
    padding: 17px;
    margin-top: 13px;
}

.post h3 {
    margin-bottom: 7px;
}

.post small {
    color: #718096;
}

.post-actions {
    display: flex;
    gap: 8px;
    margin-top: 13px;
}

#preview {
    display: none;
    margin-top: 20px;
    background: white;
    padding: 18px;
    border-radius: 9px;
    border: 1px solid #dce4ee;
}

#preview img {
    max-width: 100%;
    border-radius: 8px;
    margin: 12px 0;
}

#previewContent {
    white-space: pre-wrap;
    line-height: 1.6;
}

@media(max-width:600px) {
    h1 { font-size: 32px; }
    header { padding: 16px 5%; }
}
</style>
</head>

<body>

<header>
    <img
      class="logo"
      src="WhatsApp_Image_2026-07-11_at_15.30.43-removebg-preview.png"
      onclick="location.href='index.html'"
      alt="LMS NETWORK"
    >
    <a class="home" href="index.html">Startseite</a>
</header>

<main>

    <section id="login">
        <h1>BLOG ADMIN</h1>
        <p class="subtitle">Melde dich mit deinem LMS-Administrator-Konto an.</p>

        <div class="panel">
            <label>E-Mail</label>
            <input type="email" id="email" placeholder="Deine E-Mail">

            <label>Passwort</label>
            <input type="password" id="password" placeholder="Dein Passwort">

            <div class="actions">
                <button class="primary" onclick="login()">Anmelden</button>
            </div>

            <p id="status"></p>
        </div>
    </section>

    <section id="dashboard">
        <h1>Beiträge</h1>
        <p class="subtitle">Verwalte deine LMS-Blogbeiträge.</p>

        <div class="actions">
            <button class="primary" onclick="newPost()">+ Neuer Beitrag</button>
            <button class="secondary" onclick="logout()">Abmelden</button>
        </div>

        <div id="postList"></div>
    </section>

    <section id="editor">
        <h1 id="editorTitle">Neuer Beitrag</h1>
        <p class="subtitle">Schreibe und veröffentliche deinen Blogbeitrag.</p>

        <div class="panel">
            <label>Titel</label>
            <input id="title" placeholder="Titel des Beitrags">

            <label>Kategorie</label>
            <select id="category">
                <option>Allgemein</option>
                <option>News</option>
                <option>Updates</option>
                <option>Events</option>
                <option>Community</option>
            </select>

            <label>Bild-URL (optional)</label>
            <input id="image" placeholder="https://...">

            <label>Beitrag</label>
            <textarea id="content" placeholder="Schreibe hier deinen Beitrag ..."></textarea>

            <div class="actions">
                <button class="primary" onclick="savePost(true)">Veröffentlichen</button>
                <button class="secondary" onclick="savePost(false)">Als Entwurf speichern</button>
                <button class="secondary" onclick="showPreview()">Vorschau</button>
                <button class="secondary" onclick="backToDashboard()">Zurück</button>
            </div>

            <div id="preview">
                <h2 id="previewTitle"></h2>
                <img id="previewImage" alt="" style="display:none">
                <p id="previewContent"></p>
            </div>

            <p id="status"></p>
        </div>
    </section>

</main>

<script>
const SUPABASE_URL = "https://kxafgbrdybonjxwfziee.supabase.co";
const SUPABASE_KEY = "DEIN_SUPABASE_PUBLIC_KEY";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentPostId = null;

function status(message) {
    document.getElementById("status").textContent = message;
}

async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    status("Anmeldung läuft ...");

    const { error } = await db.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        status("Anmeldung fehlgeschlagen: " + error.message);
        return;
    }

    await checkAdmin();
}

async function checkAdmin() {
    const { data: { user }, error: userError } = await db.auth.getUser();

    if (userError || !user) {
        status("Bitte melde dich erneut an.");
        return;
    }

    const { data, error } = await db.rpc("is_lms_admin");

    if (error || data !== true) {
        status("Du hast keine Administrator-Berechtigung.");
        await db.auth.signOut();
        return;
    }

    document.getElementById("login").style.display = "none";
    document.getElementById("editor").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    await loadPosts();
}

async function loadPosts() {
    const { data, error } = await db
        .from("blog_posts")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        document.getElementById("postList").textContent =
            "Beiträge konnten nicht geladen werden: " + error.message;
        return;
    }

    const list = document.getElementById("postList");
    list.innerHTML = "";

    if (!data.length) {
        list.textContent = "Noch keine Beiträge vorhanden.";
        return;
    }

    data.forEach(post => {
        const item = document.createElement("div");
        item.className = "post";

        const heading = document.createElement("h3");
        heading.textContent = post.title;

        const meta = document.createElement("small");
        meta.textContent =
            post.category + " · " +
            (post.published ? "Veröffentlicht" : "Entwurf");

        const actions = document.createElement("div");
        actions.className = "post-actions";

        const edit = document.createElement("button");
        edit.className = "secondary";
        edit.textContent = "Bearbeiten";
        edit.onclick = () => editPost(post);

        const remove = document.createElement("button");
        remove.className = "danger";
        remove.textContent = "Löschen";
        remove.onclick = () => deletePost(post.id);

        actions.append(edit, remove);
        item.append(heading, meta, actions);
        list.appendChild(item);
    });
}

function newPost() {
    currentPostId = null;

    document.getElementById("title").value = "";
    document.getElementById("category").value = "Allgemein";
    document.getElementById("image").value = "";
    document.getElementById("content").value = "";
    document.getElementById("editorTitle").textContent = "Neuer Beitrag";
    document.getElementById("preview").style.display = "none";

    document.getElementById("dashboard").style.display = "none";
    document.getElementById("editor").style.display = "block";
    status("");
}

function editPost(post) {
    currentPostId = post.id;

    document.getElementById("title").value = post.title;
    document.getElementById("category").value = post.category;
    document.getElementById("image").value = post.image_url || "";
    document.getElementById("content").value = post.content;
    document.getElementById("editorTitle").textContent = "Beitrag bearbeiten";
    document.getElementById("preview").style.display = "none";

    document.getElementById("dashboard").style.display = "none";
    document.getElementById("editor").style.display = "block";
    status("");
}

async function savePost(published) {
    const title = document.getElementById("title").value.trim();
    const category = document.getElementById("category").value;
    const image = document.getElementById("image").value.trim();
    const content = document.getElementById("content").value.trim();

    if (!title || !content) {
        status("Bitte gib einen Titel und einen Beitragstext ein.");
        return;
    }

    if (image) {
        try {
            const url = new URL(image);
            if (url.protocol !== "https:" && url.protocol !== "http:") {
                throw new Error();
            }
        } catch {
            status("Bitte gib eine gültige Bild-URL ein.");
            return;
        }
    }

    const post = {
        title,
        category,
        image_url: image || null,
        content,
        published,
        updated_at: new Date().toISOString()
    };

    let result;

    if (currentPostId) {
        result = await db
            .from("blog_posts")
            .update(post)
            .eq("id", currentPostId);
    } else {
        result = await db
            .from("blog_posts")
            .insert(post);
    }

    if (result.error) {
        status("Fehler: " + result.error.message);
        return;
    }

    alert(published ? "Beitrag veröffentlicht!" : "Entwurf gespeichert!");
    backToDashboard();
}

function showPreview() {
    const title = document.getElementById("title").value;
    const image = document.getElementById("image").value;
    const content = document.getElementById("content").value;

    document.getElementById("previewTitle").textContent = title;
    document.getElementById("previewContent").textContent = content;

    const previewImage = document.getElementById("previewImage");

    if (image) {
        previewImage.src = image;
        previewImage.style.display = "block";
    } else {
        previewImage.style.display = "none";
        previewImage.removeAttribute("src");
    }

    document.getElementById("preview").style.display = "block";
}

async function deletePost(id) {
    if (!confirm("Möchtest du diesen Beitrag wirklich löschen?")) return;

    const { error } = await db
        .from("blog_posts")
        .delete()
        .eq("id", id);

    if (error) {
        alert("Löschen fehlgeschlagen: " + error.message);
        return;
    }

    await loadPosts();
}

async function backToDashboard() {
    document.getElementById("editor").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    await loadPosts();
}

async function logout() {
    await db.auth.signOut();

    document.getElementById("dashboard").style.display = "none";
    document.getElementById("editor").style.display = "none";
    document.getElementById("login").style.display = "block";

    status("Du wurdest abgemeldet.");
}

async function restoreSession() {
    const { data: { session } } = await db.auth.getSession();

    if (session) {
        await checkAdmin();
    }
}

restoreSession();
</script>

</body>
</html>
