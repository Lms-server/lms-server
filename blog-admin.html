
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Admin | LMS NETWORK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #102b50;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 7%;
    border-bottom: 1px solid #e5eaf0;
}

.logo {
    width: 65px;
    cursor: pointer;
}

.home {
    text-decoration: none;
    color: #102b50;
    border: 1px solid #102b50;
    padding: 10px 18px;
    border-radius: 7px;
    font-weight: bold;
}

main {
    max-width: 850px;
    margin: 55px auto;
    padding: 0 20px;
}

h1 {
    font-size: 42px;
    margin-bottom: 8px;
}

.subtitle {
    color: #718096;
    margin-bottom: 35px;
}

.panel {
    background: #f5f8fc;
    border: 1px solid #e1e8f0;
    border-radius: 14px;
    padding: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin: 18px 0 8px;
}

input, textarea, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccd6e2;
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
    background: white;
    color: #102b50;
}

textarea {
    min-height: 220px;
    resize: vertical;
    line-height: 1.6;
}

button {
    border: none;
    border-radius: 7px;
    padding: 12px 18px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.primary {
    background: #102b50;
    color: white;
}

.secondary {
    background: #e1eaf5;
    color: #102b50;
}

.danger {
    background: #ffe8e8;
    color: #a32323;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
}

#editor, #dashboard {
    display: none;
}

.status {
    margin-top: 15px;
    color: #315d91;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.post {
    background: white;
    border: 1px solid #e1e8f0;
    border-radius: 10px;
    padding: 17px;
    margin-top: 13px;
}

.post h3 {
    margin-bottom: 7px;
}

.post small {
    color: #718096;
}

.post-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 13px;
}

#preview {
    display: none;
    margin-top: 20px;
    background: white;
    padding: 18px;
    border-radius: 9px;
    border: 1px solid #dce4ee;
}

#preview img {
    max-width: 100%;
    max-height: 350px;
    object-fit: contain;
    border-radius: 8px;
    margin: 12px 0;
}

#previewContent {
    white-space: pre-wrap;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

@media(max-width:600px) {
    h1 { font-size: 32px; }
    header { padding: 16px 5%; }
    .panel { padding: 18px; }
}
</style>
</head>

<body>

<header>
    <img
      class="logo"
      src="WhatsApp_Image_2026-07-11_at_15.30.43-removebg-preview.png"
      onclick="location.href='index.html'"
      alt="LMS NETWORK"
    >
    <a class="home" href="index.html">Startseite</a>
</header>

<main>

    <!-- LOGIN -->
    <section id="login">
        <h1>BLOG ADMIN</h1>
        <p class="subtitle">Melde dich mit deinem LMS-Administrator-Konto an.</p>

        <div class="panel">
            <label for="email">E-Mail</label>
            <input type="email" id="email" placeholder="Deine E-Mail" autocomplete="username">

            <label for="password">Passwort</label>
            <input type="password" id="password" placeholder="Dein Passwort" autocomplete="current-password">

            <div class="actions">
                <button class="primary" id="loginButton" onclick="login()">Anmelden</button>
            </div>

            <p class="status" id="loginStatus" aria-live="polite"></p>
        </div>
    </section>

    <!-- DASHBOARD -->
    <section id="dashboard">
        <h1>Beiträge</h1>
        <p class="subtitle">Verwalte deine LMS-Blogbeiträge.</p>

        <div class="actions">
            <button class="primary" onclick="newPost()">+ Neuer Beitrag</button>
            <button class="secondary" onclick="logout()">Abmelden</button>
        </div>

        <p class="status" id="dashboardStatus" aria-live="polite"></p>
        <div id="postList"></div>
    </section>

    <!-- EDITOR -->
    <section id="editor">
        <h1 id="editorTitle">Neuer Beitrag</h1>
        <p class="subtitle">Schreibe und veröffentliche deinen Blogbeitrag.</p>

        <div class="panel">
            <label for="title">Titel</label>
            <input id="title" maxlength="180" placeholder="Titel des Beitrags">

            <label for="category">Kategorie</label>
            <select id="category">
                <option>Allgemein</option>
                <option>News</option>
                <option>Updates</option>
                <option>Events</option>
                <option>Community</option>
            </select>

            <label for="image">Bild-URL (optional)</label>
            <input id="image" type="url" placeholder="https://...">

            <label for="content">Beitrag</label>
            <textarea id="content" placeholder="Schreibe hier deinen Beitrag ..."></textarea>

            <div class="actions">
                <button class="primary" onclick="savePost(true)">Veröffentlichen</button>
                <button class="secondary" onclick="savePost(false)">Als Entwurf speichern</button>
                <button class="secondary" onclick="showPreview()">Vorschau</button>
                <button class="secondary" onclick="backToDashboard()">Zurück</button>
            </div>

            <p class="status" id="editorStatus" aria-live="polite"></p>

            <div id="preview">
                <h2 id="previewTitle"></h2>
                <img id="previewImage" alt="" style="display:none">
                <p id="previewContent"></p>
            </div>
        </div>
    </section>

</main>

<script>
/* SUPABASE VERBINDUNG */

const SUPABASE_URL = "https://kxafgbrdybonjxwfziee.supabase.co";

const SUPABASE_KEY = "sb_publishable_d8qB9cKr2st2FVwAAYHorQ_sho1knUD";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentPostId = null;
let saving = false;

/* HILFSFUNKTIONEN */

function setStatus(id, message) {
    document.getElementById(id).textContent = message;
}

function showSection(section) {
    document.getElementById("login").style.display = "none";
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("editor").style.display = "none";

    document.getElementById(section).style.display = "block";
}

/* ANMELDUNG */

async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const button = document.getElementById("loginButton");

    if (!email || !password) {
        setStatus("loginStatus", "Bitte E-Mail und Passwort eingeben.");
        return;
    }

    button.disabled = true;
    setStatus("loginStatus", "Anmeldung läuft ...");

    try {
        const { error } = await db.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            setStatus("loginStatus", "Anmeldung fehlgeschlagen: " + error.message);
            return;
        }

        await checkAdmin();

    } catch (error) {
        setStatus("loginStatus", "Fehler: " + error.message);
    } finally {
        button.disabled = false;
    }
}

/* ADMIN PRÜFEN */

async function checkAdmin() {
    const { data: { user }, error: userError } = await db.auth.getUser();

    if (userError || !user) {
        setStatus("loginStatus", "Bitte melde dich erneut an.");
        return;
    }

    const { data, error } = await db.rpc("is_lms_admin");

    if (error) {
        setStatus("loginStatus", "Admin-Prüfung fehlgeschlagen: " + error.message);
        await db.auth.signOut();
        return;
    }

    if (data !== true) {
        setStatus("loginStatus", "Du hast keine Administrator-Berechtigung.");
        await db.auth.signOut();
        return;
    }

    showSection("dashboard");
    await loadPosts();
}

/* BEITRÄGE LADEN */

async function loadPosts() {
    const list = document.getElementById("postList");

    list.replaceChildren();
    setStatus("dashboardStatus", "Beiträge werden geladen ...");

    const { data, error } = await db
        .from("blog_posts")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        setStatus("dashboardStatus", "Fehler beim Laden: " + error.message);
        return;
    }

    setStatus("dashboardStatus", "");

    if (!data || data.length === 0) {
        list.textContent = "Noch keine Beiträge vorhanden.";
        return;
    }

    data.forEach(post => {
        const item = document.createElement("div");
        item.className = "post";

        const heading = document.createElement("h3");
        heading.textContent = post.title;

        const meta = document.createElement("small");
        meta.textContent = post.category + " · " +
            (post.published ? "Veröffentlicht" : "Entwurf");

        const actions = document.createElement("div");
        actions.className = "post-actions";

        const edit = document.createElement("button");
        edit.className = "secondary";
        edit.textContent = "Bearbeiten";
        edit.onclick = () => editPost(post);

        const remove = document.createElement("button");
        remove.className = "danger";
        remove.textContent = "Löschen";
        remove.onclick = () => deletePost(post.id);

        actions.append(edit, remove);
        item.append(heading, meta, actions);
        list.appendChild(item);
    });
}

/* NEUER BEITRAG */

function newPost() {
    currentPostId = null;

    document.getElementById("title").value = "";
    document.getElementById("category").value = "Allgemein";
    document.getElementById("image").value = "";
    document.getElementById("content").value = "";
    document.getElementById("editorTitle").textContent = "Neuer Beitrag";
    document.getElementById("preview").style.display = "none";

    showSection("editor");
    setStatus("editorStatus", "");
}

/* BEITRAG BEARBEITEN */

function editPost(post) {
    currentPostId = post.id;

    document.getElementById("title").value = post.title;
    document.getElementById("category").value = post.category;
    document.getElementById("image").value = post.image_url || "";
    document.getElementById("content").value = post.content;
    document.getElementById("editorTitle").textContent = "Beitrag bearbeiten";
    document.getElementById("preview").style.display = "none";

    showSection("editor");
    setStatus("editorStatus", "");
}

/* SPEICHERN UND VERÖFFENTLICHEN */

async function savePost(published) {
    if (saving) return;

    const title = document.getElementById("title").value.trim();
    const category = document.getElementById("category").value;
    const image = document.getElementById("image").value.trim();
    const content = document.getElementById("content").value.trim();

    if (!title || !content) {
        setStatus("editorStatus", "Bitte gib einen Titel und einen Beitragstext ein.");
        return;
    }

    if (image) {
        try {
            const url = new URL(image);

            if (url.protocol !== "https:" && url.protocol !== "http:") {
                throw new Error();
            }
        } catch {
            setStatus("editorStatus", "Bitte gib eine gültige Bild-URL ein.");
            return;
        }
    }

    saving = true;
    setStatus("editorStatus", "Wird gespeichert ...");

    const post = {
        title,
        category,
        image_url: image || null,
        content,
        published,
        updated_at: new Date().toISOString()
    };

    try {
        let result;

        if (currentPostId !== null) {
            result = await db
                .from("blog_posts")
                .update(post)
                .eq("id", currentPostId);
        } else {
            result = await db
                .from("blog_posts")
                .insert(post);
        }

        if (result.error) {
            setStatus("editorStatus", "Speichern fehlgeschlagen: " + result.error.message);
            return;
        }

        alert(published
            ? "Dein Beitrag wurde veröffentlicht!"
            : "Dein Entwurf wurde gespeichert!");

        await backToDashboard();

    } catch (error) {
        setStatus("editorStatus", "Fehler: " + error.message);
    } finally {
        saving = false;
    }
}

/* VORSCHAU */

function showPreview() {
    const title = document.getElementById("title").value;
    const image = document.getElementById("image").value.trim();
    const content = document.getElementById("content").value;

    document.getElementById("previewTitle").textContent = title || "Ohne Titel";
    document.getElementById("previewContent").textContent = content;

    const previewImage = document.getElementById("previewImage");

    if (image) {
        try {
            const url = new URL(image);

            if (url.protocol !== "https:" && url.protocol !== "http:") {
                throw new Error();
            }

            previewImage.src = url.href;
            previewImage.style.display = "block";
        } catch {
            previewImage.style.display = "none";
            setStatus("editorStatus", "Die Bild-URL ist ungültig.");
        }
    } else {
        previewImage.style.display = "none";
        previewImage.removeAttribute("src");
    }

    document.getElementById("preview").style.display = "block";
}

/* LÖSCHEN */

async function deletePost(id) {
    if (!confirm("Möchtest du diesen Beitrag wirklich löschen?")) {
        return;
    }

    const { error } = await db
        .from("blog_posts")
        .delete()
        .eq("id", id);

    if (error) {
        alert("Löschen fehlgeschlagen: " + error.message);
        return;
    }

    await loadPosts();
}

/* ZURÜCK */

async function backToDashboard() {
    showSection("dashboard");
    await loadPosts();
}

/* ABMELDEN */

async function logout() {
    await db.auth.signOut();

    showSection("login");
    setStatus("loginStatus", "Du wurdest abgemeldet.");
}

/* GESPEICHERTE ANMELDUNG PRÜFEN */

async function restoreSession() {
    const { data: { session }, error } = await db.auth.getSession();

    if (error) {
        setStatus("loginStatus", "Sitzungsfehler: " + error.message);
        return;
    }

    if (session) {
        await checkAdmin();
    }
}

restoreSession();
</script>

</body>
</html>
