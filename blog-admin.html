
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Admin | LMS NETWORK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #102b50;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 7%;
    border-bottom: 1px solid #e5eaf0;
}

.logo {
    width: 65px;
    cursor: pointer;
}

.home {
    text-decoration: none;
    color: #102b50;
    border: 1px solid #102b50;
    padding: 10px 18px;
    border-radius: 7px;
    font-weight: bold;
}

main {
    max-width: 850px;
    margin: 55px auto;
    padding: 0 20px;
}

h1 {
    font-size: 42px;
    margin-bottom: 8px;
}

.subtitle {
    color: #718096;
    margin-bottom: 35px;
}

.panel {
    background: #f5f8fc;
    border: 1px solid #e1e8f0;
    border-radius: 14px;
    padding: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin: 18px 0 8px;
}

input, textarea, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccd6e2;
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
    background: white;
    color: #102b50;
}

textarea {
    min-height: 220px;
    resize: vertical;
    line-height: 1.6;
}

button {
    border: none;
    border-radius: 7px;
    padding: 12px 18px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.primary {
    background: #102b50;
    color: white;
}

.secondary {
    background: #e1eaf5;
    color: #102b50;
}

.danger {
    background: #ffe8e8;
    color: #a32323;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
}

#editor, #dashboard {
    display: none;
}

.status {
    margin-top: 15px;
    color: #315d91;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.post {
    background: white;
    border: 1px solid #e1e8f0;
    border-radius: 10px;
    padding: 17px;
    margin-top: 13px;
}

.post h3 {
    margin-bottom: 7px;
}

.post small {
    color: #718096;
}

.post-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 13px;
}

/* BILDER UPLOAD */

.drop-zone {
    width: 100%;
    min-height: 180px;
    border: 2px dashed #a9bfd8;
    border-radius: 12px;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 22px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
    color: #315d91;
}

.drop-zone:hover,
.drop-zone.dragover {
    border-color: #397fc2;
    background: #edf5ff;
}

.drop-icon {
    font-size: 35px;
}

.drop-main {
    font-weight: bold;
    font-size: 16px;
}

.drop-sub {
    font-size: 13px;
    color: #8290a1;
}

.image-preview-box {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border: 1px solid #dce4ee;
    border-radius: 10px;
    background: white;
}

.image-preview-box img {
    display: block;
    width: 100%;
    max-height: 300px;
    object-fit: contain;
    border-radius: 7px;
}

.image-info {
    margin-top: 10px;
    font-size: 13px;
    color: #718096;
    overflow-wrap: anywhere;
}

.remove-image {
    margin-top: 10px;
}

#preview {
    display: none;
    margin-top: 20px;
    background: white;
    padding: 18px;
    border-radius: 9px;
    border: 1px solid #dce4ee;
}

#preview img {
    max-width: 100%;
    max-height: 350px;
    object-fit: contain;
    border-radius: 8px;
    margin: 12px 0;
}

#previewContent {
    white-space: pre-wrap;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

@media(max-width:600px) {
    h1 { font-size: 32px; }
    header { padding: 16px 5%; }
    .panel { padding: 18px; }
}
</style>
</head>

<body>

<header>
    <img
      class="logo"
      src="WhatsApp_Image_2026-07-11_at_15.30.43-removebg-preview.png"
      onclick="location.href='index.html'"
      alt="LMS NETWORK"
    >
    <a class="home" href="index.html">Startseite</a>
</header>

<main>

    <!-- LOGIN -->
    <section id="login">
        <h1>BLOG ADMIN</h1>
        <p class="subtitle">Melde dich mit deinem LMS-Administrator-Konto an.</p>

        <div class="panel">
            <label for="email">E-Mail</label>
            <input type="email" id="email" placeholder="Deine E-Mail" autocomplete="username">

            <label for="password">Passwort</label>
            <input type="password" id="password" placeholder="Dein Passwort" autocomplete="current-password">

            <div class="actions">
                <button class="primary" id="loginButton" onclick="login()">Anmelden</button>
            </div>

            <p class="status" id="loginStatus" aria-live="polite"></p>
        </div>
    </section>

    <!-- DASHBOARD -->
    <section id="dashboard">
        <h1>Beiträge</h1>
        <p class="subtitle">Verwalte deine LMS-Blogbeiträge.</p>

        <div class="actions">
            <button class="primary" onclick="newPost()">+ Neuer Beitrag</button>
            <button class="secondary" onclick="logout()">Abmelden</button>
        </div>

        <p class="status" id="dashboardStatus" aria-live="polite"></p>
        <div id="postList"></div>
    </section>

    <!-- EDITOR -->
    <section id="editor">
        <h1 id="editorTitle">Neuer Beitrag</h1>
        <p class="subtitle">Schreibe und veröffentliche deinen Blogbeitrag.</p>

        <div class="panel">

            <label for="title">Titel</label>
            <input id="title" maxlength="180" placeholder="Titel des Beitrags">

            <label for="category">Kategorie</label>
            <select id="category">
                <option>Allgemein</option>
                <option>News</option>
                <option>Updates</option>
                <option>Events</option>
                <option>Community</option>
            </select>

            <!-- BILDER PER DRAG & DROP -->
            <label>Beitragsbild (optional)</label>

            <input
                type="file"
                id="imageFile"
                accept="image/*"
                hidden
            >

            <div
                class="drop-zone"
                id="dropZone"
                role="button"
                tabindex="0"
                aria-label="Bild auswählen oder hier hineinziehen"
            >
                <div class="drop-icon">📷</div>
                <div class="drop-main">Bild hier hineinziehen</div>
                <div class="drop-sub">oder klicken, um ein Bild auszuwählen</div>
                <div class="drop-sub">JPG, PNG, WEBP · maximal 8 MB</div>
            </div>

            <div class="image-preview-box" id="imagePreviewBox">
                <img id="imagePreview" alt="Bildvorschau">

                <div class="image-info" id="imageInfo"></div>

                <button
                    type="button"
                    class="danger remove-image"
                    onclick="removeImage()"
                >
                    Bild entfernen
                </button>
            </div>

            <label for="content">Beitrag</label>
            <textarea
                id="content"
                placeholder="Schreibe hier deinen Beitrag ..."
            ></textarea>

            <div class="actions">
                <button class="primary" id="publishButton" onclick="savePost(true)">
                    Veröffentlichen
                </button>

                <button class="secondary" id="draftButton" onclick="savePost(false)">
                    Als Entwurf speichern
                </button>

                <button class="secondary" onclick="showPreview()">
                    Vorschau
                </button>

                <button class="secondary" onclick="backToDashboard()">
                    Zurück
                </button>
            </div>

            <p class="status" id="editorStatus" aria-live="polite"></p>

            <div id="preview">
                <h2 id="previewTitle"></h2>
                <img id="previewImage" alt="" style="display:none">
                <p id="previewContent"></p>
            </div>

        </div>
    </section>

</main>

<script>

/* SUPABASE VERBINDUNG */

const SUPABASE_URL = "https://kxafgbrdybonjxwfziee.supabase.co";

const SUPABASE_KEY = "sb_publishable_d8qB9cKr2st2FVwAAYHorQ_sho1knUD";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const IMAGE_BUCKET = "blog-images";
const MAX_IMAGE_SIZE = 8 * 1024 * 1024;

let currentPostId = null;
let saving = false;

let selectedImageFile = null;
let existingImageUrl = null;
let imageRemoved = false;
let previewObjectUrl = null;

/* HILFSFUNKTIONEN */

function setStatus(id, message) {
    document.getElementById(id).textContent = message;
}

function showSection(section) {
    document.getElementById("login").style.display = "none";
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("editor").style.display = "none";

    document.getElementById(section).style.display = "block";
}

function clearImagePreviewUrl() {
    if (previewObjectUrl) {
        URL.revokeObjectURL(previewObjectUrl);
        previewObjectUrl = null;
    }
}

function resetImage() {
    selectedImageFile = null;
    existingImageUrl = null;
    imageRemoved = false;

    clearImagePreviewUrl();

    document.getElementById("imageFile").value = "";
    document.getElementById("imagePreviewBox").style.display = "none";
    document.getElementById("imagePreview").removeAttribute("src");
    document.getElementById("imageInfo").textContent = "";
}

/* BILD AUSWÄHLEN */

function selectImage(file) {
    if (!file) return;

    if (!file.type.startsWith("image/")) {
        setStatus("editorStatus", "Bitte wähle eine Bilddatei aus.");
        return;
    }

    if (file.size > MAX_IMAGE_SIZE) {
        setStatus("editorStatus", "Das Bild ist zu groß. Maximal 8 MB erlaubt.");
        return;
    }

    clearImagePreviewUrl();

    selectedImageFile = file;
    existingImageUrl = null;
    imageRemoved = false;

    previewObjectUrl = URL.createObjectURL(file);

    document.getElementById("imagePreview").src = previewObjectUrl;
    document.getElementById("imageInfo").textContent =
        file.name + " · " + (file.size / 1024 / 1024).toFixed(2) + " MB";

    document.getElementById("imagePreviewBox").style.display = "block";

    setStatus("editorStatus", "Bild ausgewählt. Es wird beim Speichern hochgeladen.");
}

/* BILD ENTFERNEN */

function removeImage() {
    resetImage();
    imageRemoved = true;

    setStatus("editorStatus", "Das Bild wurde entfernt.");
}

/* VORHANDENES BILD ANZEIGEN */

function showExistingImage(url) {
    resetImage();

    if (!url) return;

    existingImageUrl = url;
    imageRemoved = false;

    document.getElementById("imagePreview").src = url;
    document.getElementById("imageInfo").textContent = "Bereits gespeichertes Bild";

    document.getElementById("imagePreviewBox").style.display = "block";
}

/* DRAG & DROP EINRICHTEN */

const dropZone = document.getElementById("dropZone");
const imageInput = document.getElementById("imageFile");

dropZone.addEventListener("click", () => {
    imageInput.click();
});

dropZone.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        imageInput.click();
    }
});

imageInput.addEventListener("change", event => {
    const file = event.target.files[0];

    if (file) {
        selectImage(file);
    }
});

dropZone.addEventListener("dragover", event => {
    event.preventDefault();
    dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", event => {
    event.preventDefault();
    dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", event => {
    event.preventDefault();
    dropZone.classList.remove("dragover");

    const file = event.dataTransfer.files[0];

    if (file) {
        selectImage(file);
    }
});

/* BILD HOCHLADEN */

async function uploadImage(file) {
    const { data: { user }, error: userError } = await db.auth.getUser();

    if (userError || !user) {
        throw new Error("Deine Anmeldung ist abgelaufen. Bitte melde dich erneut an.");
    }

    const extensionFromName = file.name.includes(".")
        ? file.name.split(".").pop().toLowerCase()
        : "";

    const extension = extensionFromName.match(/^[a-z0-9]{1,8}$/)
        ? extensionFromName
        : "jpg";

    const randomPart = crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now() + "-" + Math.random().toString(36).slice(2);

    const filePath =
        user.id + "/" + randomPart + "." + extension;

    const { error: uploadError } = await db
        .storage
        .from(IMAGE_BUCKET)
        .upload(filePath, file, {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type
        });

    if (uploadError) {
        throw new Error("Bild-Upload fehlgeschlagen: " + uploadError.message);
    }

    const { data } = db
        .storage
        .from(IMAGE_BUCKET)
        .getPublicUrl(filePath);

    return data.publicUrl;
}

/* ANMELDUNG */

async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const button = document.getElementById("loginButton");

    if (!email || !password) {
        setStatus("loginStatus", "Bitte E-Mail und Passwort eingeben.");
        return;
    }

    button.disabled = true;
    setStatus("loginStatus", "Anmeldung läuft ...");

    try {
        const { error } = await db.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            setStatus("loginStatus", "Anmeldung fehlgeschlagen: " + error.message);
            return;
        }

        await checkAdmin();

    } catch (error) {
        setStatus("loginStatus", "Fehler: " + error.message);
    } finally {
        button.disabled = false;
    }
}

/* ADMIN PRÜFEN */

async function checkAdmin() {
    const { data: { user }, error: userError } = await db.auth.getUser();

    if (userError || !user) {
        setStatus("loginStatus", "Bitte melde dich erneut an.");
        return;
    }

    const { data, error } = await db.rpc("is_lms_admin");

    if (error) {
        setStatus("loginStatus", "Admin-Prüfung fehlgeschlagen: " + error.message);
        await db.auth.signOut();
        return;
    }

    if (data !== true) {
        setStatus("loginStatus", "Du hast keine Administrator-Berechtigung.");
        await db.auth.signOut();
        return;
    }

    showSection("dashboard");
    await loadPosts();
}

/* BEITRÄGE LADEN */

async function loadPosts() {
    const list = document.getElementById("postList");

    list.replaceChildren();
    setStatus("dashboardStatus", "Beiträge werden geladen ...");

    const { data, error } = await db
        .from("blog_posts")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        setStatus("dashboardStatus", "Fehler beim Laden: " + error.message);
        return;
    }

    setStatus("dashboardStatus", "");

    if (!data || data.length === 0) {
        list.textContent = "Noch keine Beiträge vorhanden.";
        return;
    }

    data.forEach(post => {
        const item = document.createElement("div");
        item.className = "post";

        const heading = document.createElement("h3");
        heading.textContent = post.title;

        const meta = document.createElement("small");
        meta.textContent =
            post.category + " · " +
            (post.published ? "Veröffentlicht" : "Entwurf");

        const actions = document.createElement("div");
        actions.className = "post-actions";

        const edit = document.createElement("button");
        edit.className = "secondary";
        edit.textContent = "Bearbeiten";
        edit.onclick = () => editPost(post);

        const remove = document.createElement("button");
        remove.className = "danger";
        remove.textContent = "Löschen";
        remove.onclick = () => deletePost(post.id);

        actions.append(edit, remove);
        item.append(heading, meta, actions);
        list.appendChild(item);
    });
}

/* NEUER BEITRAG */

function newPost() {
    currentPostId = null;

    document.getElementById("title").value = "";
    document.getElementById("category").value = "Allgemein";
    document.getElementById("content").value = "";
    document.getElementById("editorTitle").textContent = "Neuer Beitrag";
    document.getElementById("preview").style.display = "none";

    resetImage();

    showSection("editor");
    setStatus("editorStatus", "");
}

/* BEITRAG BEARBEITEN */

function editPost(post) {
    currentPostId = post.id;

    document.getElementById("title").value = post.title;
    document.getElementById("category").value = post.category;
    document.getElementById("content").value = post.content;
    document.getElementById("editorTitle").textContent = "Beitrag bearbeiten";
    document.getElementById("preview").style.display = "none";

    showExistingImage(post.image_url);

    showSection("editor");
    setStatus("editorStatus", "");
}

/* SPEICHERN UND VERÖFFENTLICHEN */

async function savePost(published) {
    if (saving) return;

    const title = document.getElementById("title").value.trim();
    const category = document.getElementById("category").value;
    const content = document.getElementById("content").value.trim();

    if (!title || !content) {
        setStatus("editorStatus", "Bitte gib einen Titel und einen Beitragstext ein.");
        return;
    }

    saving = true;

    document.getElementById("publishButton").disabled = true;
    document.getElementById("draftButton").disabled = true;

    try {
        let imageUrl = existingImageUrl;

        if (selectedImageFile) {
            setStatus("editorStatus", "Bild wird hochgeladen ...");
            imageUrl = await uploadImage(selectedImageFile);
        } else if (imageRemoved) {
            imageUrl = null;
        }

        setStatus("editorStatus", "Beitrag wird gespeichert ...");

        const post = {
            title,
            category,
            content,
            image_url: imageUrl,
            published,
            updated_at: new Date().toISOString()
        };

        let result;

        if (currentPostId !== null) {
            result = await db
                .from("blog_posts")
                .update(post)
                .eq("id", currentPostId);
        } else {
            result = await db
                .from("blog_posts")
                .insert(post);
        }

        if (result.error) {
            setStatus("editorStatus", "Speichern fehlgeschlagen: " + result.error.message);
            return;
        }

        alert(
            published
                ? "Dein Beitrag wurde veröffentlicht!"
                : "Dein Entwurf wurde gespeichert!"
        );

        await backToDashboard();

    } catch (error) {
        setStatus("editorStatus", error.message);
    } finally {
        saving = false;
        document.getElementById("publishButton").disabled = false;
        document.getElementById("draftButton").disabled = false;
    }
}

/* VORSCHAU */

function showPreview() {
    const title = document.getElementById("title").value;
    const content = document.getElementById("content").value;

    document.getElementById("previewTitle").textContent =
        title || "Ohne Titel";

    document.getElementById("previewContent").textContent = content;

    const previewImage = document.getElementById("previewImage");

    let imageUrl = null;

    if (selectedImageFile && previewObjectUrl) {
        imageUrl = previewObjectUrl;
    } else if (!imageRemoved && existingImageUrl) {
        imageUrl = existingImageUrl;
    }

    if (imageUrl) {
        previewImage.src = imageUrl;
        previewImage.style.display = "block";
    } else {
        previewImage.style.display = "none";
        previewImage.removeAttribute("src");
    }

    document.getElementById("preview").style.display = "block";
}

/* LÖSCHEN */

async function deletePost(id) {
    if (!confirm("Möchtest du diesen Beitrag wirklich löschen?")) {
        return;
    }

    const { error } = await db
        .from("blog_posts")
        .delete()
        .eq("id", id);

    if (error) {
        alert("Löschen fehlgeschlagen: " + error.message);
        return;
    }

    await loadPosts();
}

/* ZURÜCK */

async function backToDashboard() {
    resetImage();

    showSection("dashboard");
    await loadPosts();
}

/* ABMELDEN */

async function logout() {
    await db.auth.signOut();

    resetImage();
    showSection("login");

    setStatus("loginStatus", "Du wurdest abgemeldet.");
}

/* GESPEICHERTE ANMELDUNG PRÜFEN */

async function restoreSession() {
    const { data: { session }, error } = await db.auth.getSession();

    if (error) {
        setStatus("loginStatus", "Sitzungsfehler: " + error.message);
        return;
    }

    if (session) {
        await checkAdmin();
    }
}

restoreSession();

</script>

</body>
</html>
