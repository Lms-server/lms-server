
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog | LMS NETWORK</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff;
    color: #102746;
}

/* NAVIGATION */

header {
    border-bottom: 1px solid #e8edf3;
}

nav {
    max-width: 1150px;
    margin: auto;
    padding: 17px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: #102746;
    font-weight: 900;
    font-size: 21px;
}

.logo img {
    width: 43px;
    height: 43px;
    object-fit: contain;
}

.logo span {
    color: #397fc2;
}

.home {
    text-decoration: none;
    background: #102746;
    color: white;
    padding: 11px 22px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: bold;
    transition: .2s;
}

.home:hover {
    background: #397fc2;
}

/* BLOG TITEL */

.blog-heading {
    text-align: center;
    padding: 100px 20px 75px;
}

.blog-heading h1 {
    font-size: clamp(65px, 12vw, 115px);
    font-weight: 900;
    letter-spacing: 8px;
    color: #102746;
}

.blog-heading h1 span {
    color: #397fc2;
}

/* BEITRÄGE */

.posts {
    max-width: 1100px;
    margin: auto;
    padding: 20px 22px 80px;
}

.empty {
    text-align: center;
    padding: 65px 20px;
    border: 1px solid #e5eaf0;
    border-radius: 12px;
    color: #8290a1;
    font-size: 14px;
}

footer {
    border-top: 1px solid #e8edf3;
    text-align: center;
    padding: 22px;
    color: #8793a1;
    font-size: 12px;
}

@media(max-width: 500px) {
    .logo { font-size: 17px; }
    .logo img { width: 35px; height: 35px; }
    .home { padding: 10px 15px; }
    .blog-heading { padding: 75px 15px 55px; }
    .blog-heading h1 { letter-spacing: 4px; }
}
</style>
</head>

<body>

<header>
    <nav>
        <a href="index.html" class="logo">
            <img src="WhatsApp_Image_2026-07-11_at_15.30.43-removebg-preview.png" alt="LMS Logo">
            LMS <span>NETWORK</span>
        </a>

        <a href="index.html" class="home">Startseite</a>
    </nav>
</header>

<section class="blog-heading">
    <h1>BLO<span>G</span></h1>
</section>

<section class="posts">
    <div class="empty">
        Noch keine Beiträge veröffentlicht.
    </div>
</section>

<footer>
    © 2026 LMS NETWORK
</footer>

</body>
</html>
