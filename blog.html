
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog | LMS NETWORK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff;
    color: #102746;
}

header {
    border-bottom: 1px solid #e8edf3;
}

nav {
    max-width: 1150px;
    margin: auto;
    padding: 17px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: #102746;
    font-weight: 900;
    font-size: 21px;
}

.logo img {
    width: 43px;
    height: 43px;
    object-fit: contain;
}

.logo span {
    color: #397fc2;
}

.home {
    text-decoration: none;
    background: #102746;
    color: white;
    padding: 11px 22px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: bold;
    transition: .2s;
}

.home:hover {
    background: #397fc2;
}

.blog-heading {
    text-align: center;
    padding: 100px 20px 75px;
}

.blog-heading h1 {
    font-size: clamp(65px, 12vw, 115px);
    font-weight: 900;
    letter-spacing: 8px;
    color: #102746;
}

.blog-heading h1 span {
    color: #397fc2;
}

.posts {
    max-width: 1100px;
    margin: auto;
    padding: 20px 22px 80px;
}

.posts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
}

.post-card {
    border: 1px solid #e5eaf0;
    border-radius: 12px;
    overflow: hidden;
    background: white;
    transition: .2s;
    min-width: 0;
}

.post-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(16,39,70,.08);
}

.image-wrapper {
    width: 100%;
    height: 220px;
    background: #f0f4f8;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.post-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.image-fallback {
    display: none;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: #8290a1;
    font-size: 13px;
    text-align: center;
    padding: 20px;
}

.image-fallback .image-icon {
    font-size: 35px;
}

.post-content {
    padding: 22px;
}

.post-category {
    display: inline-block;
    color: #397fc2;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
}

.post-title {
    font-size: 22px;
    line-height: 1.3;
    margin-bottom: 13px;
    overflow-wrap: anywhere;
}

.post-text {
    color: #65758a;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.post-date {
    color: #9aa5b2;
    font-size: 11px;
    margin-top: 20px;
}

.empty,
.loading,
.error {
    text-align: center;
    padding: 55px 20px;
    border: 1px solid #e5eaf0;
    border-radius: 12px;
    font-size: 14px;
}

.empty,
.loading {
    color: #8290a1;
}

.error {
    color: #a32323;
}

footer {
    border-top: 1px solid #e8edf3;
    text-align: center;
    padding: 22px;
    color: #8793a1;
    font-size: 12px;
}

@media(max-width: 500px) {
    .logo {
        font-size: 17px;
    }

    .logo img {
        width: 35px;
        height: 35px;
    }

    .home {
        padding: 10px 15px;
    }

    .blog-heading {
        padding: 75px 15px 55px;
    }

    .blog-heading h1 {
        letter-spacing: 4px;
    }

    .posts {
        padding-left: 15px;
        padding-right: 15px;
    }
}
</style>
</head>

<body>

<header>
    <nav>
        <a href="index.html" class="logo">
            <img
                src="WhatsApp_Image_2026-07-11_at_15.30.43-removebg-preview.png"
                alt="LMS Logo"
            >
            LMS <span>NETWORK</span>
        </a>

        <a href="index.html" class="home">Startseite</a>
    </nav>
</header>

<section class="blog-heading">
    <h1>BLO<span>G</span></h1>
</section>

<section class="posts">
    <div id="postsContainer">
        <div class="loading">Beiträge werden geladen ...</div>
    </div>
</section>

<footer>
    © 2026 LMS NETWORK
</footer>

<script>

// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://kxafgbrdybonjxwfziee.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_d8qB9cKr2st2FVwAAYHorQ_sho1knUD";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ==========================================
// DATUM FORMATIEREN
// ==========================================

function formatDate(date) {
    if (!date) return "";

    const parsedDate = new Date(date);

    if (isNaN(parsedDate.getTime())) return "";

    return parsedDate.toLocaleDateString("de-DE", {
        day: "2-digit",
        month: "long",
        year: "numeric"
    });
}


// ==========================================
// BILDLINK ERKENNEN
// ==========================================

function resolveImageUrl(imageUrl) {

    if (!imageUrl || typeof imageUrl !== "string") {
        return null;
    }

    const value = imageUrl.trim();

    if (!value) return null;

    // Bereits vollständige Internetadresse

    if (/^https?:\/\//i.test(value)) {
        return value;
    }

    // Supabase Storage Pfad ohne vollständige URL

    const cleanedPath = value
        .replace(/^\/+/, "")
        .replace(/^blog-images\//, "");

    if (
        !cleanedPath.startsWith("data:") &&
        !cleanedPath.startsWith("javascript:")
    ) {
        const { data } = db.storage
            .from("blog-images")
            .getPublicUrl(cleanedPath);

        return data.publicUrl;
    }

    return null;
}


// ==========================================
// BILDKARTE ERSTELLEN
// ==========================================

function createImage(post) {

    const wrapper = document.createElement("div");
    wrapper.className = "image-wrapper";

    const fallback = document.createElement("div");
    fallback.className = "image-fallback";

    const icon = document.createElement("div");
    icon.className = "image-icon";
    icon.textContent = "📷";

    const message = document.createElement("div");
    message.textContent = "Bild momentan nicht verfügbar";

    fallback.append(icon, message);

    const imageUrl = resolveImageUrl(post.image_url);

    if (!imageUrl) {
        fallback.style.display = "flex";
        wrapper.appendChild(fallback);
        return wrapper;
    }

    const image = document.createElement("img");

    image.className = "post-image";
    image.alt = post.title || "Blogbild";
    image.loading = "lazy";

    // Nicht no-referrer erzwingen:
    // Manche Bildanbieter benötigen den normalen Referrer.

    image.onload = () => {
        fallback.style.display = "none";
    };

    image.onerror = () => {
        console.error(
            "Blogbild konnte nicht geladen werden:",
            imageUrl
        );

        image.style.display = "none";
        fallback.style.display = "flex";
    };

    image.src = imageUrl;

    wrapper.appendChild(image);
    wrapper.appendChild(fallback);

    return wrapper;
}


// ==========================================
// BEITRAGSKARTE ERSTELLEN
// ==========================================

function createPostCard(post) {

    const card = document.createElement("article");
    card.className = "post-card";

    // Bild

    card.appendChild(createImage(post));

    // Inhalt

    const content = document.createElement("div");
    content.className = "post-content";

    const category = document.createElement("div");
    category.className = "post-category";
    category.textContent = post.category || "Allgemein";

    const title = document.createElement("h2");
    title.className = "post-title";
    title.textContent = post.title || "Ohne Titel";

    const text = document.createElement("p");
    text.className = "post-text";
    text.textContent = post.content || "";

    const date = document.createElement("div");
    date.className = "post-date";
    date.textContent = formatDate(post.created_at);

    content.append(
        category,
        title,
        text,
        date
    );

    card.appendChild(content);

    return card;
}


// ==========================================
// BLOG BEITRÄGE LADEN
// ==========================================

async function loadBlogPosts() {

    const container =
        document.getElementById("postsContainer");

    container.innerHTML =
        '<div class="loading">Beiträge werden geladen ...</div>';

    try {

        const { data, error } = await db
            .from("blog_posts")
            .select(
                "id, title, category, content, image_url, created_at"
            )
            .eq("published", true)
            .order("created_at", {
                ascending: false
            });

        if (error) {
            throw error;
        }

        container.innerHTML = "";

        if (!data || data.length === 0) {

            const empty = document.createElement("div");

            empty.className = "empty";
            empty.textContent =
                "Noch keine Beiträge veröffentlicht.";

            container.appendChild(empty);

            return;
        }

        const grid = document.createElement("div");
        grid.className = "posts-grid";

        data.forEach(post => {

            const card = createPostCard(post);

            grid.appendChild(card);
        });

        container.appendChild(grid);

    } catch (error) {

        console.error("Blog-Fehler:", error);

        container.innerHTML = "";

        const message = document.createElement("div");

        message.className = "error";

        message.textContent =
            "Die Beiträge konnten gerade nicht geladen werden. Bitte versuche es später erneut.";

        container.appendChild(message);
    }
}


// ==========================================
// START
// ==========================================

loadBlogPosts();

</script>

</body>
</html>
