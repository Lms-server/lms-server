
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog | LMS NETWORK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff;
    color: #102746;
}

/* NAVIGATION */

header {
    border-bottom: 1px solid #e8edf3;
}

nav {
    max-width: 1150px;
    margin: auto;
    padding: 17px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: #102746;
    font-weight: 900;
    font-size: 21px;
}

.logo img {
    width: 43px;
    height: 43px;
    object-fit: contain;
}

.logo span {
    color: #397fc2;
}

.home {
    text-decoration: none;
    background: #102746;
    color: white;
    padding: 11px 22px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: bold;
    transition: .2s;
}

.home:hover {
    background: #397fc2;
}

/* BLOG TITEL */

.blog-heading {
    text-align: center;
    padding: 100px 20px 75px;
}

.blog-heading h1 {
    font-size: clamp(65px, 12vw, 115px);
    font-weight: 900;
    letter-spacing: 8px;
    color: #102746;
}

.blog-heading h1 span {
    color: #397fc2;
}

/* BEITRÄGE */

.posts {
    max-width: 1100px;
    margin: auto;
    padding: 20px 22px 80px;
}

.posts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
}

.post-card {
    border: 1px solid #e5eaf0;
    border-radius: 12px;
    overflow: hidden;
    background: white;
    transition: .2s;
}

.post-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(16,39,70,.08);
}

.post-image {
    width: 100%;
    height: 210px;
    object-fit: cover;
    display: block;
    background: #f0f4f8;
}

.post-content {
    padding: 22px;
}

.post-category {
    display: inline-block;
    color: #397fc2;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
}

.post-title {
    font-size: 22px;
    line-height: 1.3;
    margin-bottom: 13px;
    overflow-wrap: anywhere;
}

.post-text {
    color: #65758a;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.post-date {
    color: #9aa5b2;
    font-size: 11px;
    margin-top: 20px;
}

.empty {
    text-align: center;
    padding: 65px 20px;
    border: 1px solid #e5eaf0;
    border-radius: 12px;
    color: #8290a1;
    font-size: 14px;
}

.loading {
    text-align: center;
    padding: 45px 20px;
    color: #8290a1;
    font-size: 14px;
}

.error {
    text-align: center;
    padding: 35px 20px;
    color: #a32323;
    font-size: 14px;
}

footer {
    border-top: 1px solid #e8edf3;
    text-align: center;
    padding: 22px;
    color: #8793a1;
    font-size: 12px;
}

@media(max-width: 500px) {
    .logo { font-size: 17px; }
    .logo img { width: 35px; height: 35px; }
    .home { padding: 10px 15px; }
    .blog-heading { padding: 75px 15px 55px; }
    .blog-heading h1 { letter-spacing: 4px; }
    .posts { padding-left: 15px; padding-right: 15px; }
}
</style>
</head>

<body>

<header>
    <nav>
        <a href="index.html" class="logo">
            <img src="WhatsApp_Image_2026-07-11_at_15.30.43-removebg-preview.png" alt="LMS Logo">
            LMS <span>NETWORK</span>
        </a>

        <a href="index.html" class="home">Startseite</a>
    </nav>
</header>

<section class="blog-heading">
    <h1>BLO<span>G</span></h1>
</section>

<section class="posts">
    <div id="postsContainer">
        <div class="loading">Beiträge werden geladen ...</div>
    </div>
</section>

<footer>
    © 2026 LMS NETWORK
</footer>

<script>
/* SUPABASE VERBINDUNG */

const SUPABASE_URL = "https://kxafgbrdybonjxwfziee.supabase.co";

const SUPABASE_KEY = "sb_publishable_d8qB9cKr2st2FVwAAYHorQ_sho1knUD";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* DATUM FORMATIEREN */

function formatDate(date) {
    if (!date) return "";

    return new Date(date).toLocaleDateString("de-DE", {
        day: "2-digit",
        month: "long",
        year: "numeric"
    });
}

/* BEITRÄGE LADEN */

async function loadBlogPosts() {
    const container = document.getElementById("postsContainer");

    const { data, error } = await db
        .from("blog_posts")
        .select("id, title, category, content, image_url, created_at")
        .eq("published", true)
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Blog-Fehler:", error);

        container.innerHTML = "";

        const message = document.createElement("div");
        message.className = "error";
        message.textContent = "Die Beiträge konnten gerade nicht geladen werden.";

        container.appendChild(message);
        return;
    }

    container.innerHTML = "";

    if (!data || data.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Noch keine Beiträge veröffentlicht.";

        container.appendChild(empty);
        return;
    }

    const grid = document.createElement("div");
    grid.className = "posts-grid";

    data.forEach(post => {
        const card = document.createElement("article");
        card.className = "post-card";

        if (post.image_url) {
            const image = document.createElement("img");
            image.className = "post-image";
            image.src = post.image_url;
            image.alt = post.title;
            image.loading = "lazy";
            image.referrerPolicy = "no-referrer";

            image.onerror = () => {
                image.remove();
            };

            card.appendChild(image);
        }

        const content = document.createElement("div");
        content.className = "post-content";

        const category = document.createElement("div");
        category.className = "post-category";
        category.textContent = post.category || "Allgemein";

        const title = document.createElement("h2");
        title.className = "post-title";
        title.textContent = post.title;

        const text = document.createElement("p");
        text.className = "post-text";
        text.textContent = post.content;

        const date = document.createElement("div");
        date.className = "post-date";
        date.textContent = formatDate(post.created_at);

        content.append(category, title, text, date);
        card.appendChild(content);
        grid.appendChild(card);
    });

    container.appendChild(grid);
}

/* START */

loadBlogPosts();
</script>

</body>
</html>
